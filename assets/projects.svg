<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" fill="none">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7dcfff"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#9ece6a"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .title { font-size: 22px; font-weight: 700; fill: #c0caf5; }
      .en { font-size: 13.5px; fill: #a9b1d6; }
      .ru { font-size: 13px; fill: #7f88b2; }
      .chip { font-size: 11.5px; font-weight: 600; }
      .status { font-size: 11px; font-weight: 600; fill: #565f89; letter-spacing: .5px; }
    </style>
  </defs>

  <!-- ============ CARD 1: AI AGENT ============ -->
  <g transform="translate(6 6)">
    <rect width="284" height="288" rx="16" fill="#1a1b27"/>
    <rect width="284" height="288" rx="16" fill="url(#glow)"/>
    <rect x=".75" y=".75" width="282.5" height="286.5" rx="15.5" stroke="url(#border)" stroke-width="1.5"/>
    <!-- mic icon -->
    <g transform="translate(24 26)">
      <rect width="48" height="48" rx="12" fill="#24283b"/>
      <rect x="18" y="10" width="12" height="20" rx="6" fill="#7aa2f7"/>
      <path d="M13 24a11 11 0 0 0 22 0M24 35v5M18 40h12" stroke="#7aa2f7" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- sound wave -->
    <g transform="translate(92 34)" fill="#bb9af7">
      <rect x="0" y="10" width="5" height="12" rx="2.5"><animate attributeName="height" values="12;30;12" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="10;1;10" dur="1s" repeatCount="indefinite"/></rect>
      <rect x="10" y="4" width="5" height="24" rx="2.5"><animate attributeName="height" values="24;8;24" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="4;12;4" dur="1.2s" repeatCount="indefinite"/></rect>
      <rect x="20" y="8" width="5" height="16" rx="2.5"><animate attributeName="height" values="16;32;16" dur=".9s" repeatCount="indefinite"/><animate attributeName="y" values="8;0;8" dur=".9s" repeatCount="indefinite"/></rect>
      <rect x="30" y="2" width="5" height="28" rx="2.5"><animate attributeName="height" values="28;10;28" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="2;11;2" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="40" y="10" width="5" height="12" rx="2.5"><animate attributeName="height" values="12;26;12" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="10;3;10" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="50" y="6" width="5" height="20" rx="2.5"><animate attributeName="height" values="20;6;20" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="6;13;6" dur="1s" repeatCount="indefinite"/></rect>
    </g>
    <text x="24" y="112" class="title">AI Agent</text>
    <text x="24" y="138" class="en">Voice control for your computer</text>
    <text x="24" y="157" class="en">instead of a keyboard</text>
    <text x="24" y="182" class="ru">Голосовое управление ПК</text>
    <g transform="translate(24 206)">
      <rect width="56" height="22" rx="11" fill="#7aa2f7" fill-opacity=".15"/><text x="28" y="15" class="chip" fill="#7aa2f7" text-anchor="middle">Voice</text>
      <rect x="62" width="62" height="22" rx="11" fill="#bb9af7" fill-opacity=".15"/><text x="93" y="15" class="chip" fill="#bb9af7" text-anchor="middle">Desktop</text>
      <rect x="130" width="34" height="22" rx="11" fill="#7dcfff" fill-opacity=".15"/><text x="147" y="15" class="chip" fill="#7dcfff" text-anchor="middle">AI</text>
    </g>
    <circle cx="28" cy="256" r="4" fill="#9ece6a"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="40" y="260" class="status">IN DEVELOPMENT · PRIVATE</text>
  </g>

  <!-- ============ CARD 2: TRACKER ============ -->
  <g transform="translate(308 6)">
    <rect width="284" height="288" rx="16" fill="#1a1b27"/>
    <rect width="284" height="288" rx="16" fill="url(#glow)"/>
    <rect x=".75" y=".75" width="282.5" height="286.5" rx="15.5" stroke="url(#border)" stroke-width="1.5"/>
    <g transform="translate(24 26)">
      <rect width="48" height="48" rx="12" fill="#24283b"/>
      <path d="M13 34V14M13 34h22" stroke="#9ece6a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M17 29l5-6 4 3 7-9" stroke="#9ece6a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- progress chart -->
    <g transform="translate(92 26)">
      <path d="M0 40 L22 30 L44 34 L66 18 L88 22 L110 6 L160 0" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="200" stroke-dashoffset="200">
        <animate attributeName="stroke-dashoffset" values="200;0;0;200" keyTimes="0;.45;.85;1" dur="4s" repeatCount="indefinite"/>
      </path>
      <circle cx="110" cy="6" r="4" fill="#9ece6a"><animate attributeName="r" values="0;0;4;4;0" keyTimes="0;.35;.45;.85;1" dur="4s" repeatCount="indefinite"/></circle>
    </g>
    <text x="24" y="112" class="title">Tracker</text>
    <text x="24" y="138" class="en">Progress diary with sync</text>
    <text x="24" y="157" class="en">across all your devices</text>
    <text x="24" y="182" class="ru">Дневник прогресса</text>
    <g transform="translate(24 206)">
      <rect width="68" height="22" rx="11" fill="#9ece6a" fill-opacity=".15"/><text x="34" y="15" class="chip" fill="#9ece6a" text-anchor="middle">Android</text>
      <rect x="74" width="68" height="22" rx="11" fill="#7dcfff" fill-opacity=".15"/><text x="108" y="15" class="chip" fill="#7dcfff" text-anchor="middle">Electron</text>
      <rect x="148" width="48" height="22" rx="11" fill="#7aa2f7" fill-opacity=".15"/><text x="172" y="15" class="chip" fill="#7aa2f7" text-anchor="middle">Web</text>
    </g>
    <circle cx="28" cy="256" r="4" fill="#9ece6a"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" begin=".5s" repeatCount="indefinite"/></circle>
    <text x="40" y="260" class="status">IN DEVELOPMENT · PRIVATE</text>
  </g>

  <!-- ============ CARD 3: FUNNEL ============ -->
  <g transform="translate(610 6)">
    <rect width="284" height="288" rx="16" fill="#1a1b27"/>
    <rect width="284" height="288" rx="16" fill="url(#glow)"/>
    <rect x=".75" y=".75" width="282.5" height="286.5" rx="15.5" stroke="url(#border)" stroke-width="1.5"/>
    <g transform="translate(24 26)">
      <rect width="48" height="48" rx="12" fill="#24283b"/>
      <path d="M12 14h24l-9 11v9l-6 3V25z" stroke="#ff9e64" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
    <!-- funnel flow -->
    <g transform="translate(96 22)">
      <path d="M0 4h130l-44 22v20h-42V26z" fill="#ff9e64" fill-opacity=".08" stroke="#ff9e64" stroke-opacity=".5" stroke-width="1.5" stroke-linejoin="round"/>
      <circle r="3.5" fill="#ff9e64"><animateMotion path="M12 8 L65 30 L65 50" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" dur="2s" repeatCount="indefinite"/></circle>
      <circle r="3.5" fill="#bb9af7"><animateMotion path="M118 8 L65 30 L65 50" dur="2s" begin=".7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" dur="2s" begin=".7s" repeatCount="indefinite"/></circle>
      <circle r="3.5" fill="#7dcfff"><animateMotion path="M65 6 L65 30 L65 50" dur="2s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" dur="2s" begin="1.3s" repeatCount="indefinite"/></circle>
    </g>
    <text x="24" y="112" class="title">Воронка · Funnel</text>
    <text x="24" y="138" class="en">Full-funnel monitoring</text>
    <text x="24" y="157" class="en">of every key metric</text>
    <text x="24" y="182" class="ru">Мониторинг всех показателей</text>
    <g transform="translate(24 206)">
      <rect width="80" height="22" rx="11" fill="#ff9e64" fill-opacity=".15"/><text x="40" y="15" class="chip" fill="#ff9e64" text-anchor="middle">Analytics</text>
      <rect x="86" width="86" height="22" rx="11" fill="#bb9af7" fill-opacity=".15"/><text x="129" y="15" class="chip" fill="#bb9af7" text-anchor="middle">Dashboard</text>
    </g>
    <circle cx="28" cy="256" r="4" fill="#9ece6a"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" begin="1s" repeatCount="indefinite"/></circle>
    <text x="40" y="260" class="status">IN DEVELOPMENT · PRIVATE</text>
  </g>
</svg>
